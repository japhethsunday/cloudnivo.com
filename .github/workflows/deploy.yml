name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 'Where to deploy'
        required: true
        default: staging
        type: choice
        options: [staging, production]

# Staging deploys automatically on main. Production deploys ONLY via manual
# dispatch against the `production` environment (required reviewers configured
# in repo settings). Tokens live in GitHub secrets — never in this file.
# Required secrets: RAILWAY_TOKEN, RAILWAY_PROJECT_ID,
# VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.

jobs:
  deploy-staging:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'staging')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install Railway CLI
        run: npm i -g @railway/cli
      - name: Install dependencies
        # `railway run` executes locally with the service env injected, so the
        # runner needs node_modules (drizzle-kit/tsx live here, not in images).
        run: npm ci --no-audit --no-fund
      - name: Deploy API, worker, realtime
        run: |
          set -euo pipefail
          for svc in cloudnivo-api-staging cloudnivo-worker-staging cloudnivo-realtime-staging; do
            railway up --service "$svc" --environment staging --detach
          done
      # Migrate AFTER the rebuild (see production job): the release files
      # only exist in images built from this commit.
      - name: Migrate control database
        run: |
          set -euo pipefail
          : "${RAILWAY_TOKEN:?RAILWAY_TOKEN_STAGING secret is not set}"
          : "${RAILWAY_PROJECT_ID:?RAILWAY_PROJECT_ID secret is not set}"
          # No `railway link`: the staging project token implies project+environment.
          railway run --service cloudnivo-api-staging -- npm run db:migrate --workspace=packages/database
          railway run --service cloudnivo-api-staging -- npm run db:seed --workspace=packages/database
      - name: Readiness gate
        run: |
          set -euo pipefail
          test -n "${{ vars.STAGING_API_URL }}" || { echo 'STAGING_API_URL var is not set'; exit 1; }
          for i in $(seq 1 36); do
            curl -fsS "${{ vars.STAGING_API_URL }}/api/v1/health/ready" && break || sleep 10
          done
          curl -fsS "${{ vars.STAGING_API_URL }}/api/v1/health/ready" | grep -q '"ready"'

  deploy-production:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install CLIs
        run: |
          npm i -g @railway/cli
          npm i -g vercel@latest
      - name: Install dependencies
        # `railway run` executes locally with the service env injected, so the
        # runner needs node_modules (drizzle-kit/tsx live here, not in images).
        run: npm ci --no-audit --no-fund
      - name: Deploy Railway services
        run: |
          set -euo pipefail
          for svc in cloudnivo-api cloudnivo-worker cloudnivo-realtime; do
            railway up --service "$svc" --environment production --detach
          done
      # Migrate AFTER the rebuild (see staging job): migration 0007 is
      # additive (new tables), so the brief mixed-version window is safe.
      - name: Migrate control database
        run: |
          set -euo pipefail
          : "${RAILWAY_TOKEN:?RAILWAY_TOKEN secret is not set}"
          : "${RAILWAY_PROJECT_ID:?RAILWAY_PROJECT_ID secret is not set}"
          # No `railway link`: the production project token implies project+environment.
          railway run --service cloudnivo-api -- npm run db:migrate --workspace=packages/database
          railway run --service cloudnivo-api -- npm run db:seed --workspace=packages/database
      - name: Deploy dashboard to Vercel
        run: |
          set -euo pipefail
          : "${VERCEL_TOKEN:?VERCEL_TOKEN secret is not set}"
          : "${VERCEL_ORG_ID:?VERCEL_ORG_ID secret is not set}"
          : "${VERCEL_PROJECT_ID:?VERCEL_PROJECT_ID secret is not set}"
          vercel --prod --token="$VERCEL_TOKEN" --yes
      - name: Readiness gate
        run: |
          set -euo pipefail
          test -n "${{ vars.PRODUCTION_API_URL }}" || { echo 'PRODUCTION_API_URL var is not set'; exit 1; }
          for i in $(seq 1 36); do
            curl -fsS "${{ vars.PRODUCTION_API_URL }}/api/v1/health/ready" && break || sleep 10
          done
          curl -fsS "${{ vars.PRODUCTION_API_URL }}/api/v1/health/ready" | grep -q '"ready"'
