name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 'Where to deploy'
        required: true
        default: staging
        type: choice
        options: [staging, production]

# Least privilege: nothing in this workflow writes to the repository.
# `actions: read` lets the production preflight read CI's conclusion for the
# commit it is about to ship; it grants no write anywhere.
permissions:
  contents: read
  actions: read

# Staging deploys immediately on a push to main. Production ALSO deploys on a
# push to main, but only after its preflight has waited for CI on that exact
# commit and seen it conclude `success`; it can still be dispatched by hand
# for a re-deploy. Both checks live below, in this file, where they can be
# reviewed — see the preflight step.
#
# A HUMAN APPROVAL GATE IS NOT ENFORCED HERE, and cannot be: a workflow
# cannot grant itself one. It comes from the `production` environment's
# "Required reviewers" setting (Settings → Environments → production). If
# that list is empty, a dispatch deploys with no human in the loop, however
# green this preflight is. Treat the preflight as defence in depth, not as
# the approval gate.
#
# Tokens live in GitHub secrets — never in this file.
# Required secrets: RAILWAY_TOKEN, RAILWAY_PROJECT_ID,
# VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.

jobs:
  deploy-staging:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'staging')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install Railway CLI
        run: npm i -g @railway/cli
      - name: Deploy API, worker, realtime
        run: |
          set -euo pipefail
          for svc in cloudnivo-api-staging cloudnivo-worker-staging cloudnivo-realtime-staging; do
            railway up --service "$svc" --environment staging --detach
          done
      # Boot-time migrate+seed: `railway run` executes on the runner (no route
      # to *.railway.internal from outside), so services migrate and seed
      # themselves on boot via MIGRATE_ON_BOOT (idempotent DDL + seed).
      - name: Enable boot migration
        run: |
          set -euo pipefail
          : "${RAILWAY_TOKEN:?RAILWAY_TOKEN_STAGING secret is not set}"
          # No `railway link`: the staging project token implies project+environment.
          railway variable set MIGRATE_ON_BOOT=true --service cloudnivo-api-staging --environment staging
      - name: Readiness gate
        run: |
          set -euo pipefail
          test -n "${{ vars.STAGING_API_URL }}" || { echo 'STAGING_API_URL var is not set'; exit 1; }
          for i in $(seq 1 36); do
            curl -fsS "${{ vars.STAGING_API_URL }}/api/v1/health/ready" && break || sleep 10
          done
          curl -fsS "${{ vars.STAGING_API_URL }}/api/v1/health/ready" | grep -q '"ready"'

  deploy-production:
    # Auto-deploys on every merge to main, and still dispatchable by hand for
    # a re-deploy. The preflight below is what makes the automatic path safe:
    # it WAITS for CI on this exact commit and refuses anything but green.
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'production')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    # One production deploy at a time. Two merges in quick succession would
    # otherwise race each other onto the same services, and the later commit
    # is not guaranteed to win. Never cancel in progress: a half-applied
    # deploy is worse than a queued one.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # Production's canonical API origin, declared here rather than read from
      # a repository variable. It used to come from vars.PRODUCTION_API_URL,
      # which still held the generated Railway host — so the readiness gate
      # was proving the wrong hostname healthy while the product moved to its
      # own domain, and nothing in review could see that.
      PRODUCTION_API_URL: https://api.cloudnivo.org
    steps:
      - uses: actions/checkout@v4
      # Preflight runs BEFORE any CLI is installed or any credential is used,
      # so a refused deploy touches nothing. Both checks are about the commit
      # being shipped, not about who asked for it.
      - name: Preflight — wait for CI, refuse anything but green main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # 1. Branch. workflow_dispatch lets the caller pick any ref, so
          #    without this a feature branch deploys to production.
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "::error::Production deploys only from main (got '${{ github.ref_name }}')."
            exit 1
          fi

          # 2. CI, for this exact commit.
          #
          #    This job has no `needs:` — CI and Deploy are separate workflows
          #    triggered by the same push, so they start at the SAME moment.
          #    A snapshot read would therefore always find nothing and refuse
          #    every automatic deploy. So we WAIT for the run to finish, then
          #    judge its conclusion.
          #
          #    Self-dispatched CI runs are excluded: a green must come from
          #    the automatic run, otherwise anyone could hand-trigger CI to
          #    manufacture one. Re-runs keep the original `push` event, so a
          #    legitimate re-run still counts.
          sha='${{ github.sha }}'
          query="repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$sha"
          jq_status='[.workflow_runs[] | select(.event != "workflow_dispatch")] | first | .status // empty'
          jq_concl='[.workflow_runs[] | select(.event != "workflow_dispatch")] | first | .conclusion // empty'

          echo "Waiting for CI to finish for $sha"
          status=''
          for _ in $(seq 1 120); do            # 120 × 15s = 30 minutes
            status=$(gh api "$query" --jq "$jq_status" || echo '')
            [ "$status" = 'completed' ] && break
            sleep 15
          done

          if [ "$status" != 'completed' ]; then
            echo "::error::CI for $sha did not finish within 30 minutes. Not deploying a commit whose tests never reported."
            exit 1
          fi

          conclusion=$(gh api "$query" --jq "$jq_concl")
          if [ "$conclusion" != 'success' ]; then
            echo "::error::CI concluded '$conclusion' for $sha. Production deploys require a green CI run."
            exit 1
          fi
          echo "CI passed for $sha — proceeding."
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install CLIs
        run: |
          npm i -g @railway/cli
          npm i -g vercel@latest
      - name: Deploy Railway services
        run: |
          set -euo pipefail
          for svc in cloudnivo-api cloudnivo-worker cloudnivo-realtime; do
            railway up --service "$svc" --environment production --detach
          done
      # Boot-time migrate+seed (see staging job): services migrate and seed
      # themselves on boot via MIGRATE_ON_BOOT (idempotent DDL + seed).
      - name: Enable boot migration
        run: |
          set -euo pipefail
          : "${RAILWAY_TOKEN:?RAILWAY_TOKEN secret is not set}"
          # No `railway link`: the production project token implies project+environment.
          railway variable set MIGRATE_ON_BOOT=true --service cloudnivo-api --environment production
      - name: Deploy dashboard to Vercel
        run: |
          set -euo pipefail
          : "${VERCEL_TOKEN:?VERCEL_TOKEN secret is not set}"
          : "${VERCEL_ORG_ID:?VERCEL_ORG_ID secret is not set}"
          : "${VERCEL_PROJECT_ID:?VERCEL_PROJECT_ID secret is not set}"
          # NEXT_PUBLIC_API_URL is declared HERE rather than left to the
          # Vercel project's stored settings. It is inlined into the bundle at
          # build time AND builds the dashboard's CSP connect-src (the
          # https:// and wss:// origins), so it decides which host the app may
          # talk to at all — that belongs in version control next to the code
          # it affects, not in dashboard state nobody can review.
          vercel --prod --token="$VERCEL_TOKEN" --yes \
            --build-env NEXT_PUBLIC_API_URL="$PRODUCTION_API_URL"
      - name: Readiness gate
        run: |
          set -euo pipefail
          for i in $(seq 1 36); do
            curl -fsS "$PRODUCTION_API_URL/api/v1/health/ready" && break || sleep 10
          done
          curl -fsS "$PRODUCTION_API_URL/api/v1/health/ready" | grep -q '"ready"'
          # The gate must also prove the deploy is serving the real domain,
          # not just that something answers: a certificate or routing mistake
          # on api.cloudnivo.org has to fail the deploy, not pass it quietly.
          case "$PRODUCTION_API_URL" in
            *railway.app*) echo "production API URL is still a Railway host"; exit 1 ;;
          esac
