name: cloudnivo
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cloudnivo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cloudnivo_dev_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-cloudnivo}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - cloudnivo

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    # NOTE: when REDIS_PASSWORD is empty, redis-server still starts (no auth).
    # Production must set REDIS_PASSWORD. See .env.example.
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - cloudnivo

  # Standalone data/control API (same image Railway deploys).
  # Start with: docker compose --profile api up --build
  # The Docker socket lets the containerized API provision project databases
  # on the shared network (local-dev tradeoff, documented in docs/security.md).
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-cloudnivo}:${POSTGRES_PASSWORD:-cloudnivo_dev_password_change_me}@postgres:5432/${POSTGRES_DB:-cloudnivo}
      REDIS_URL: redis://redis:6379
      API_PORT: 3001
      PROVISION_HOST_MODE: container
    ports:
      - '${API_PORT:-3001}:3001'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cloudnivo
    profiles:
      - api

  # Background worker: drains orphaned provisioning jobs from the shared
  # store. Needs CONTROL_STORE=drizzle to share state with the API.
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-cloudnivo}:${POSTGRES_PASSWORD:-cloudnivo_dev_password_change_me}@postgres:5432/${POSTGRES_DB:-cloudnivo}
      REDIS_URL: redis://redis:6379
      WORKER_PORT: 3003
    ports:
      - '${WORKER_PORT:-3003}:3003'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cloudnivo
    profiles:
      - api
      - worker

  # Standalone realtime gateway: same code as in-process upgrades, own port.
  realtime:
    build:
      context: .
      dockerfile: Dockerfile.realtime
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-cloudnivo}:${POSTGRES_PASSWORD:-cloudnivo_dev_password_change_me}@postgres:5432/${POSTGRES_DB:-cloudnivo}
      REDIS_URL: redis://redis:6379
      REALTIME_PORT: 3002
    ports:
      - '${REALTIME_PORT:-3002}:3002'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cloudnivo
    profiles:
      - api
      - realtime

networks:
  cloudnivo:
    name: cloudnivo
    driver: bridge

volumes:
  pgdata:
    name: cloudnivo_pgdata
  redisdata:
    name: cloudnivo_redisdata
